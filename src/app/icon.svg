<!--
  Browser-tab mark. A lens, drawn as geometry rather than as a monogram: at 16px
  a letterform is mush, and an SVG <text> would render in whatever serif the
  device happens to have. Colours are the theme's --color-ink and --color-gold,
  copied literally because this file is served standalone and reaches none of the
  stylesheet's tokens.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0b0b0d" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#d4af37" stroke-width="2" />
  <circle cx="16" cy="16" r="3.5" fill="#d4af37" />
</svg>

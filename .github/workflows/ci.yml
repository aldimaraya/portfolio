name: CI

# The gate on `main`. Everything here has to pass before a pull request can
# merge, so it is deliberately the four checks that are fast and deterministic —
# see "Release flow" in docs/architecture.md for why E2E is not among them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same branch makes the first run irrelevant. Cancelling it
# is the difference between paying for every commit and paying for every review.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Job-scoped rather than step-scoped, because `prisma generate` needs
    # DATABASE_URL too: prisma.config.ts resolves it through `env()`, which
    # throws when unset, and generate runs from postinstall during `npm ci` —
    # long before the build step that obviously needs a database.
    env:
      # Must be *reachable*, not merely present: prerendering runs the page
      # queries, so a placeholder string fails the build. Points at a
      # long-lived Neon branch cut from production, which CI owns — the step
      # before the build pushes each run's schema onto it. Never production's
      # URL: that push would apply an unmerged branch's schema to the live DB.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      R2_PUBLIC_BASE_URL: https://media.example.com

    steps:
      - uses: actions/checkout@v5

      # Read the version from .nvmrc rather than pinning it here, so CI and a
      # laptop cannot drift apart silently.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`, so there is no separate generate
      # step — and that is also what makes typecheck work below.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The branch is brought to *this* run's schema rather than kept in step
      # with production by hand. Kept that way it lagged every production
      # `db:push` until someone reset it, and failed every build in between;
      # this way a PR builds against the schema it ships, which is the one
      # production will have — schema is pushed before merge.
      #
      # No --accept-data-loss: with schema changes additive, a run only ever
      # adds. The one case that would drop something is a branch cut before
      # another PR's column landed on this database; that fails here, loudly,
      # and resetting the Neon branch from its parent clears it.
      - run: npx prisma db push

      - run: npm run build

      # The R2 credentials, ADMIN_PASSWORD_HASH and SESSION_SECRET are
      # deliberately absent. authEnv() and storageEnv() are lazy and memoised
      # (lib/env.ts), so a build never parses them. If a change makes one
      # evaluate at module scope, this job failing is the correct signal —
      # do not pre-empt it with fake secrets.
